name: Frontend handoff test

on:
    push:
        branches:
            - handoff-test

permissions:
    contents: write

concurrency:
    group: frontend-handoff-test
    cancel-in-progress: false

jobs:
    handoff:
        name: Build and publish test handoff
        runs-on: ubuntu-latest
        steps:
            - name: Checkout full history
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn

            - name: Install source dependencies
              run: yarn install --frozen-lockfile

            - name: Verify source
              run: yarn verify

            - name: Build source
              run: yarn build

            - name: Generate frontend handoff
              env:
                  HANDOFF_SOURCE_BRANCH: ${{ github.ref_name }}
                  HANDOFF_SOURCE_COMMIT: ${{ github.sha }}
                  HANDOFF_GENERATED_AT: ${{ github.event.head_commit.timestamp }}
              run: node scripts/build-frontend-handoff.mjs "$RUNNER_TEMP/frontend-handoff"

            - name: Install handoff dependencies
              working-directory: ${{ runner.temp }}/frontend-handoff
              run: yarn install --frozen-lockfile

            - name: Verify handoff types
              working-directory: ${{ runner.temp }}/frontend-handoff
              run: yarn typecheck

            - name: Build handoff
              working-directory: ${{ runner.temp }}/frontend-handoff
              run: yarn build

            - name: Publish test handoff with history
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_COMMIT: ${{ github.sha }}
              shell: bash
              run: |
                  source_dir="$RUNNER_TEMP/frontend-handoff"
                  publish_dir="$RUNNER_TEMP/frontend-handoff-publish"
                  target_branch="frontend-handoff-test"
                  repository="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  if git ls-remote --exit-code --heads "$repository" "$target_branch" > /dev/null; then
                      git clone --branch "$target_branch" --single-branch "$repository" "$publish_dir"
                  else
                      mkdir -p "$publish_dir"
                      git -C "$publish_dir" init
                      git -C "$publish_dir" switch --orphan "$target_branch"
                      git -C "$publish_dir" remote add origin "$repository"
                  fi

                  rsync -a --delete \
                      --exclude='.git/' \
                      --exclude='.next/' \
                      --exclude='node_modules/' \
                      "$source_dir/" "$publish_dir/"

                  git -C "$publish_dir" config user.name 'github-actions[bot]'
                  git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git -C "$publish_dir" add --all

                  if git -C "$publish_dir" diff --cached --quiet; then
                      echo '변경된 frontend handoff 파일이 없습니다.'
                      exit 0
                  fi

                  git -C "$publish_dir" commit -m "chore: sync frontend handoff test from ${SOURCE_COMMIT}"
                  git -C "$publish_dir" push origin "HEAD:${target_branch}"
